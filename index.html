<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kangmansen · 个人主页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
               "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB",
             "Microsoft YaHei", sans-serif;
    background: #fafafa;
    color: #333;
   min-height: 100vh;
 display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 24px;
  }

  .container {
   width: 100%;
    max-width: 760px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* -------- 头像 + 信息 --------- */
  .profile {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 48px;
  width: 100%;
  flex-wrap: wrap;
  }

  /* 直角长方形头像框 */
  .avatar {
    flex: 0 0 auto;
    width: 160px;
    height: 200px;            /* 4:5，直角无圆角 */
  overflow: hidden;
    background: #eceff1;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .08);
    cursor: pointer;

    /* 旋转轴心 = 底部中点，所以底边中点始终钉住不动 */
    transform-origin: bottom center;
   will-change: transform;
  }

  /* 照片填满画框：cover 裁切，object-position 决定裁掉哪里 */
  .avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 25%;  /* 头在上方，往上偏一点保住脸 */
    display: block;
    -webkit-user-drag: none;
    user-select: none;
  }

  /* 鼠标只要还在头像上，就一直摇晃 */
  @media (hover: hover) and (pointer: fine) {
  .avatar:hover {
     animation: shake .8s ease-in-out infinite;
    }
  }

  /* 触屏设备：按住时摇晃，松手即停 */
  .avatar:active {
    animation: shake .8s ease-in-out infinite;
  }

  @keyframes shake {
  0%   { transform: rotate(0deg); }
  25%  { transform: rotate(-8deg); }
   50%  { transform: rotate(0deg); }
    75%  { transform: rotate(8deg); }
    100% { transform: rotate(0deg); }
  }
  /* ---------- 右侧信息 ------ */
  .info {
    flex: 1 1 280px;
   min-width: 240px;
    line-height: 1.9;
    font-size: 1rem;
    color: #4a4a4a;
  }

  .nickname {
  font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: .5px;
    color: #2c3e50;
  text-align: center;
    margin-bottom: 14px;
  }

  .info p {
    margin: 6px 0;
   word-break: break-word;
 }

  .label {
    color: #8a8a8a;
    font-weight: 500;
 }

  .info a {
    color: #3498db;
    text-decoration: none;
   border-bottom: 1px dashed #3498db;
   transition: color .2s, border-color .2s;
  }

  .info a:hover {
    color: #217dbb;
    border-bottom-style: solid;
  }

  /* -------- 自我介绍 ----- */
  .intro {
    width: 100%;
    max-width: 620px;
    margin-top: 56px;
    padding-top: 36px;
    border-top: 1px solid #e8e8e8;
    text-align: center;
   font-size: 1.05rem;
    line-height: 1.9;
    color: #555;
  }

  /* --------- 响应式 ---------- */
  @media (max-width: 620px) {
    body { padding: 40px 20px; }

    .profile {
      flex-direction: column;
      gap: 32px;
    }

    .avatar {
    width: 140px;
      height: 175px;
    }

    .info {
      flex: none;
      width: 10%;
     min-width: 0;
      text-align: center;
    }

    .nickname { font-size: 1.6rem; }

    .intro {
      margin-top: 40px;
     padding-top: 28px;
      font-size: 1rem;
    }
  }
</style>
</head>

</body>
